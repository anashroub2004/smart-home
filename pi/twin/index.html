<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Digital twin · Smart home</title>
<style>
  :root{--bg:#0E0F12;--surface:#16181C;--tile:#1A1C20;--border:#24272C;--text:#F2F3F5;--muted:#9BA1AA;--dim:#6E747D;
        --accent:#8FB8FF;--fan:#2BB3A3;--light:#F5A524;--good:#34C759;--warn:#FFB020;--bad:#FF5A52;--person:#C792EA}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
  button{font:inherit;color:inherit;cursor:pointer}
  .num{font-variant-numeric:tabular-nums}
  header{display:flex;flex-wrap:wrap;align-items:center;gap:14px 22px;padding:14px 20px;border-bottom:1px solid var(--border);background:#111216;position:sticky;top:0;z-index:5}
  .brand{font-weight:700;font-size:16px;display:flex;align-items:center;gap:10px}
  .badge{font-size:11.5px;font-weight:700;padding:2px 9px;border-radius:999px;background:#1F2227;color:var(--muted)}
  .clock{display:flex;align-items:baseline;gap:10px}
  .clock .t{font-size:30px;font-weight:700;letter-spacing:-.02em}
  .clock .d{color:var(--muted)}
  .seg{display:inline-flex;background:#1B1D22;border:1px solid var(--border);border-radius:10px;padding:3px;gap:2px}
  .seg button{background:none;border:0;padding:5px 10px;border-radius:7px;color:var(--muted);font-weight:600}
  .seg button.on{background:#2A2E35;color:var(--text)}
  .lbl{font-size:11.5px;color:var(--dim);text-transform:uppercase;letter-spacing:.06em;font-weight:700;margin-right:4px}
  main{display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:18px;padding:18px 20px;align-items:start}
  @media (max-width:1100px){main{grid-template-columns:1fr}}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:14px 16px}
  .card h3{margin:0 0 10px;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
  #plan{width:100%;height:auto;display:block}
  .room-name{fill:var(--text);font-weight:700;font-size:17px}
  .room-sub{fill:var(--muted);font-size:13px}
  .devlabel{fill:#D5D9DF;font-size:12.5px;font-weight:600}
  .devstate{fill:var(--muted);font-size:11.5px}
  .ai-tag{font-size:11.5px;font-weight:700}
  .spin{transform-box:fill-box;transform-origin:center;animation:spin var(--spd,1s) linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .pulse{animation:pulse 1.2s ease-out infinite}
  @keyframes pulse{0%{opacity:1}100%{opacity:.15}}
  .clickable{cursor:pointer}
  .tabs{display:flex;gap:4px;margin-bottom:12px;background:#1B1D22;border-radius:12px;padding:3px}
  .tabs button{flex:1;border:0;background:none;padding:7px 4px;border-radius:9px;color:var(--muted);font-weight:600}
  .tabs button.on{background:#2A2E35;color:var(--text)}
  .row{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-top:1px solid var(--border)}
  .row:first-child{border-top:0}
  .muted{color:var(--muted)} .small{font-size:12.5px}
  .chip{font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:999px;white-space:nowrap;background:#1F2227}
  .bar{height:6px;border-radius:3px;background:#262A30;overflow:hidden;width:90px;flex:none;margin-top:7px}
  .bar>span{display:block;height:100%;background:var(--accent)}
  .btn{background:#22252B;border:1px solid #2E3238;border-radius:10px;padding:7px 12px;font-weight:600}
  .btn:hover{background:#2A2E35}
  .btn.pri{background:#ECEEF1;color:#111;border-color:#ECEEF1}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:4px}
  .metrics b{display:block;font-size:20px}
  .metrics span{font-size:12px;color:var(--muted)}
  .pass{color:var(--good)} .fail{color:var(--bad)}
  #timeline{width:100%;height:auto;display:block}
  .banner{background:#2A2210;color:var(--warn);border-radius:12px;padding:8px 12px;display:flex;gap:10px;align-items:center;margin-bottom:10px}
  select,input[type=range]{background:#1B1D22;color:var(--text);border:1px solid var(--border);border-radius:8px;padding:4px}
  .hint{font-size:12px;color:var(--dim);margin-top:8px}
  .ev-title{font-weight:600}
  button,.clickable,select,input{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
  button:active,.btn:active{transform:scale(.97)}
  .btn,.seg button,.tabs button{transition:background-color .12s,opacity .12s}
  .busy{opacity:.55}
  g.clickable:hover>rect{stroke:#4A5A78}
  g.clickable.busy{opacity:.6}
  .badge.busy-ai{color:var(--warn)}
  @media (prefers-reduced-motion:reduce){.spin,.pulse{animation:none}}
</style>
</head>
<body>
<header>
  <div class="brand">Digital twin <span class="badge" id="mode">…</span> <span class="badge" id="aistatus"></span></div>
  <div class="clock"><span class="t num" id="time">--:--</span><span class="d" id="date"></span></div>
  <div><span class="lbl">Speed</span><span class="seg" id="speeds"></span></div>
  <div><span class="lbl">Jump to</span><span class="seg" id="jumps"></span></div>
</header>
<main>
  <section>
    <div id="manualBanner" class="banner" style="display:none">
      <span style="flex:1">You are moving the person. The routine is paused.</span>
      <button class="btn" data-cmd='{"action":"routine"}'>Back to routine</button>
    </div>
    <div class="card" style="padding:10px">
      <svg id="plan" viewBox="0 0 1000 640" role="img" aria-label="Floor plan with the person, devices and sensors"><g id="planBody"></g><g id="avatar" transform="translate(445,610)"><g id="avatarBody"></g></g></svg>
    </div>
    <div class="card" style="margin-top:14px">
      <h3>Today</h3>
      <svg id="timeline" viewBox="0 0 1000 200" role="img" aria-label="Timeline of today"></svg>
      <div class="hint">Faint bar: the planned routine · solid: where the person really was and when each device was on · ◆ AI actions · click a room on the plan to move the person, click a device to press its wall button.</div>
    </div>
  </section>
  <aside>
    <div class="tabs" id="tabs"></div>
    <div id="panel"></div>
  </aside>
</main>
<script>
// Rendering model (kept fast on purpose):
//  * one poll at a time (no pile-up), paused while the tab is hidden, 304 when nothing changed;
//  * every section is built as a string, skipped if identical to the last one, otherwise PATCHED into the
//    existing DOM (morph) — buttons, hover, focus and CSS animations survive, so clicks are never lost;
//  * one delegated click/change handler (data-cmd / data-tab / data-change) instead of inline handlers;
//  * a command returns the new state at once, so the page answers without waiting for the next poll.
const ROOM_BOX = {   // the proposed studio layout (rooms not listed here are placed in a row below)
  living:   {x:30,  y:30,  w:530, h:300},
  bedroom:  {x:560, y:30,  w:410, h:300},
  kitchen:  {x:30,  y:330, w:300, h:240},
  entrance: {x:330, y:330, w:230, h:240},
  bathroom: {x:760, y:330, w:210, h:240},
};
const HALL = {x:560, y:330, w:200, h:240};
const DOORS = {     // [roomA, roomB] -> point on the wall between them
  "living|kitchen":[180,330], "living|entrance":[445,330], "living|bedroom":[560,180],
  "entrance|hall":[560,450], "hall|bathroom":[760,450], "entrance|out":[445,590],
};
const ROOM_COLOR = {living:"#8FB8FF", kitchen:"#F5A524", bedroom:"#C792EA", bathroom:"#2BB3A3", entrance:"#9BA1AA", out:"#3A3F47"};
const SPEEDS = [1, 10, 60, 300, 600];
const JUMPS = ["06:00", "08:00", "16:30", "19:00", "23:00"];
const POLL_MS = 400;
let S = null, tab = "ai", lastPoll = 0, anim = null, avatar = {x: 445, y: 610}, etag = null, renderQueued = false;
const last = {};   // last HTML string per section

const $ = (id) => document.getElementById(id);
const esc = (t) => String(t ?? "").replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const cmd = (o) => `data-cmd="${esc(JSON.stringify(o))}"`;
const pad = (n) => String(n).padStart(2, "0");
const hm = (ts) => { const d = new Date(ts * 1000); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const mmss = (s) => s <= 0 ? "0:00" : s >= 600 ? `${Math.round(s / 60)} min` : `${Math.floor(s / 60)}:${pad(Math.floor(s % 60))}`;
const setText = (el, t) => { const n = el.firstChild; if (n && n.nodeType === 3 && !n.nextSibling) n.nodeValue = t; else el.textContent = t; };
const pct = (x) => x == null ? "—" : `${Math.round(x * 100)}%`;

// ------------------------------------------------------------------ DOM patching (tiny morph)
const SVG_NS = "http://www.w3.org/2000/svg";
function parse(html, svg) {
  const box = svg ? document.createElementNS(SVG_NS, "g") : document.createElement("div");
  box.innerHTML = html;
  return box;
}
function patchAttrs(a, b) {
  for (const {name} of [...a.attributes]) if (!b.hasAttribute(name)) a.removeAttribute(name);
  for (const {name, value} of b.attributes) if (a.getAttribute(name) !== value) a.setAttribute(name, value);
}
function patchNode(a, b) {
  if (a.nodeType !== b.nodeType || a.nodeName !== b.nodeName) { a.replaceWith(b); return; }
  if (a.nodeType === 3 || a.nodeType === 8) { if (a.nodeValue !== b.nodeValue) a.nodeValue = b.nodeValue; return; }
  if (a === document.activeElement && /^(INPUT|SELECT|TEXTAREA)$/.test(a.nodeName)) return;   // don't fight the user
  patchAttrs(a, b);
  if (a.nodeName === "INPUT" && a.value !== (b.getAttribute("value") ?? a.value)) a.value = b.getAttribute("value");
  if (a.nodeName === "OPTION") a.selected = b.hasAttribute("selected");
  patchChildren(a, b);
}
function patchChildren(a, b) {
  const na = a.childNodes, nb = [...b.childNodes];
  for (let i = 0; i < nb.length; i++) {
    if (i < na.length) patchNode(na[i], nb[i]); else a.appendChild(nb[i]);
  }
  while (na.length > nb.length) a.removeChild(a.lastChild);
}
function morph(key, el, html, svg = false) {
  if (last[key] === html) return false;          // nothing changed: no DOM work at all
  last[key] = html;
  patchChildren(el, parse(html, svg));
  return true;
}

// ------------------------------------------------------------------ talking to the simulator
async function send(c, el) {
  el?.classList.add("busy");
  try {
    const r = await fetch("/cmd", {method: "POST", body: JSON.stringify(c)});
    if (r.ok) accept(await r.json(), r.headers.get("ETag"));
  } catch (e) { offline(); }
  finally { el?.classList.remove("busy"); }
}
function accept(state, tag) {
  S = state; etag = tag || null; lastPoll = performance.now(); queueRender();
}
function offline() { $("mode").textContent = "simulator stopped"; }
async function poll() {
  try {
    const r = await fetch("/state", {headers: etag ? {"If-None-Match": etag} : {}});
    if (r.status === 304) return;
    if (r.ok) accept(await r.json(), r.headers.get("ETag"));
  } catch (e) { offline(); }
}
async function pollLoop() {
  for (;;) {
    if (!document.hidden) await poll();            // one request at a time, never piling up
    await new Promise((res) => setTimeout(res, POLL_MS));
  }
}
document.addEventListener("visibilitychange", () => { if (!document.hidden) poll(); });
document.addEventListener("click", (e) => {
  const t = e.target.closest("[data-tab],[data-cmd]");
  if (!t) return;
  if (t.dataset.tab) { tab = t.dataset.tab; last.panel = null; queueRender(); return; }
  if (t.disabled) return;
  if (t.parentElement?.classList.contains("seg")) {          // instant feedback; the server's answer confirms it
    for (const b of t.parentElement.children) b.classList.toggle("on", b === t);
  }
  send(JSON.parse(t.dataset.cmd), t);
});
document.addEventListener("change", (e) => {
  const t = e.target;
  if (t.dataset.change === "fault") send({action: "fault", device: t.dataset.device, kind: t.value || null}, t);
  else if (t.dataset.change === "temp") send({action: "temp", delta: +t.value}, t);
});
function queueRender() {
  if (renderQueued) return;
  renderQueued = true;
  requestAnimationFrame(() => { renderQueued = false; render(); });
}

// ------------------------------------------------------------------ geometry
let boxCache = {key: "", B: null};
function boxes() {
  const key = Object.keys(S.rooms).join(",");
  if (boxCache.key === key) return boxCache.B;
  const out = {...ROOM_BOX}; let extra = 0;
  for (const rid of Object.keys(S.rooms)) if (!out[rid]) { out[rid] = {x: 30 + extra * 240, y: 600, w: 230, h: 150}; extra++; }
  boxCache = {key, B: out};
  return out;
}
function center(b) { return [b.x + b.w * 0.36, b.y + b.h * 0.55]; }
const GRAPH = (() => {
  const g = {}, add = (a, b) => { (g[a] ||= []).push(b); (g[b] ||= []).push(a); };
  for (const k of Object.keys(DOORS)) { const [a, b] = k.split("|"); add(a, b); }
  return g;
})();
function routeRooms(from, to) {
  const prev = {[from]: null}, q = [from];
  while (q.length) { const n = q.shift(); if (n === to) break; for (const m of GRAPH[n] || []) if (!(m in prev)) { prev[m] = n; q.push(m); } }
  if (!(to in prev)) return [from, to];
  const path = []; for (let n = to; n != null; n = prev[n]) path.unshift(n); return path;
}
function pointOf(room, B) { if (room === "out" || !room) return [445, 615]; if (room === "hall") return [HALL.x + HALL.w / 2, HALL.y + HALL.h / 2]; return center(B[room] || ROOM_BOX.living); }
function waypoints(from, to, B) {
  const rooms = routeRooms(from || "out", to || "out"), pts = [pointOf(rooms[0], B)];
  for (let i = 1; i < rooms.length; i++) {
    const d = DOORS[`${rooms[i - 1]}|${rooms[i]}`] || DOORS[`${rooms[i]}|${rooms[i - 1]}`];
    if (d) pts.push(d);
    pts.push(pointOf(rooms[i], B));
  }
  return pts;
}

// ------------------------------------------------------------------ header
const MODE = {"twin-only": "No Firebase · in memory", cloud: "Real Firebase", emulator: "Local emulator"};
function header() {
  const ai = S.ai, mode = MODE[S.mode] || S.mode;
  if ($("mode").textContent !== mode) $("mode").textContent = mode;
  const st = $("aistatus");
  const txt = S.ai_busy ? "AI retraining · house time waits" : ai ? `AI ${ai.status}${ai.data_source === "simulated" ? " · simulated data" : ""}` : "AI off";
  if (st.textContent !== txt) st.textContent = txt;
  st.style.color = S.ai_busy ? "var(--warn)" : ai ? (ai.status === "ready" ? "var(--good)" : "var(--warn)") : "var(--muted)";
  morph("speeds", $("speeds"),
    `<button class="${S.paused ? "on" : ""}" ${cmd({action: S.paused ? "resume" : "pause"})}>${S.paused ? "Play" : "Pause"}</button>` +
    SPEEDS.map((v) => `<button class="${!S.paused && Math.round(S.speed) === v ? "on" : ""}" ${cmd({action: "speed", value: v})}>${v}×</button>`).join(""));
  morph("jumps", $("jumps"), JUMPS.map((t) => `<button ${cmd({action: "jump", time: t})}>${t}</button>`).join(""));
  const show = S.person.manual ? "flex" : "none";
  if ($("manualBanner").style.display !== show) $("manualBanner").style.display = show;
}
let clockText = "", dateKey = "", dateText = "";
function tickClock() {
  if (!S) return;
  const now = S.now + (S.paused ? 0 : (performance.now() - lastPoll) / 1000 * S.speed);
  const d = new Date(now * 1000);
  const t = `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
  if (t !== clockText) { clockText = t; setText($("time"), t); }
  const k = `${d.toDateString()}|${S.speed}|${S.paused}`;
  if (k !== dateKey) {
    dateKey = k;
    dateText = d.toLocaleDateString("en-GB", {weekday: "long", day: "numeric", month: "short"}) + (S.speed > 1 && !S.paused ? `  ·  ${Math.round(S.speed)}× faster` : "");
    setText($("date"), dateText);
  }
}

// ------------------------------------------------------------------ floor plan
function iconSvg(d, x, y) {
  const on = d.v === 1, c = d.icon === "fan" ? "var(--fan)" : d.icon === "light" ? "var(--light)" : d.icon === "tv" ? "var(--accent)" : "#B9BEC6";
  if (d.icon === "fan") {
    const spd = on ? `${(1.6 - (d.level || 70) / 100).toFixed(2)}s` : "0s";
    return `<g transform="translate(${x},${y})"><circle r="17" fill="${on ? "#123330" : "#1F2227"}"/><g class="${on ? "spin" : ""}" style="--spd:${spd}">${[0, 120, 240].map((a) => `<ellipse rx="4.5" ry="10" cy="-8" fill="${on ? c : "#555B63"}" transform="rotate(${a})"/>`).join("")}</g><circle r="3" fill="#0E0F12"/></g>`;
  }
  if (d.icon === "light") {
    return `<g transform="translate(${x},${y})"><circle r="30" fill="${c}" opacity="${on ? ".18" : "0"}"/><circle r="17" fill="${on ? "#3A2A0C" : "#1F2227"}"/><path d="M-5 5h10M-4 9h8M0 -11a8 8 0 0 1 5 14h-10a8 8 0 0 1 5-14z" stroke="${on ? c : "#555B63"}" stroke-width="2" fill="none"/></g>`;
  }
  if (d.icon === "tv") {
    return `<g transform="translate(${x},${y})"><circle r="17" fill="${on ? "#17233A" : "#1F2227"}"/><rect x="-10" y="-7" width="20" height="13" rx="2" fill="${on ? c : "none"}" stroke="${on ? c : "#555B63"}" stroke-width="2"/></g>`;
  }
  if (d.icon === "lock") {
    return `<g transform="translate(${x},${y})"><circle r="17" fill="${on ? "#13261B" : "#1F2227"}"/><rect x="-7" y="-2" width="14" height="10" rx="2" fill="none" stroke="${on ? "var(--good)" : "#9BA1AA"}" stroke-width="2"/><path d="M-4 -2v-4a4 4 0 0 1 8 0${on ? "" : "v4"}" fill="none" stroke="${on ? "var(--good)" : "#9BA1AA"}" stroke-width="2"/></g>`;
  }
  return `<g transform="translate(${x},${y})"><circle r="17" fill="${on ? "#1E2A3F" : "#1F2227"}"/><circle r="6" fill="${on ? c : "#555B63"}"/></g>`;
}
function devicesByRoom() {
  const by = {};
  for (const [id, d] of Object.entries(S.devices)) (by[d.room] ||= []).push([id, d]);
  return by;
}
function drawPlan() {
  const B = boxes(), ai = S.ai || {}, now = S.now, out = [], byRoom = devicesByRoom();
  const maxY = Math.max(...Object.values(B).map((b) => b.y + b.h)) + 60;
  const vb = `0 0 1000 ${maxY}`;
  if ($("plan").getAttribute("viewBox") !== vb) $("plan").setAttribute("viewBox", vb);
  out.push(`<rect x="${HALL.x}" y="${HALL.y}" width="${HALL.w}" height="${HALL.h}" fill="#121317" stroke="#1E2126" stroke-width="2"/><text x="${HALL.x + 14}" y="${HALL.y + 26}" class="room-sub">Hall</text>`);
  for (const [rid, b] of Object.entries(B)) {
    const r = S.rooms[rid]; if (!r) continue;
    const occ = r.occ === 1 || S.person.room === rid;
    out.push(`<g class="clickable" ${cmd({action: "move", room: rid})}><rect x="${b.x}" y="${b.y}" width="${b.w}" height="${b.h}" rx="14" fill="${occ ? "#1B1F27" : "#16181C"}" stroke="${r.offline ? "#4A2020" : occ ? "#3B4A66" : "#24272C"}" stroke-width="2"${r.offline ? ' stroke-dasharray="8 6"' : ""}/><text x="${b.x + 16}" y="${b.y + 28}" class="room-name">${esc(r.name)}${r.hidden ? " · door" : ""}</text>`);
    const bits = [];
    if (r.temp != null) bits.push(`${r.temp}°C`);
    if (r.lux != null) bits.push(`${r.lux} lx`);
    if (r.offline) bits.push("node offline");
    out.push(`<text x="${b.x + 16}" y="${b.y + 48}" class="room-sub num">${bits.join(" · ")}</text>`);
    const hw = (r.hardware || []).join(" ").toLowerCase(); let sx = b.x + b.w - 20;
    if (hw.includes("pir")) { out.push(`<circle cx="${sx}" cy="${b.y + 22}" r="6" fill="${r.pir ? "var(--warn)" : "#2A2E35"}" class="${r.pir ? "pulse" : ""}"><title>PIR (motion)</title></circle>`); sx -= 22; }
    if (hw.includes("mmwave")) out.push(`<path d="M${sx - 8} ${b.y + 28} a10 10 0 0 1 16 0 M${sx - 12} ${b.y + 24} a15 15 0 0 1 24 0" stroke="${r.mmwave ? "var(--good)" : "#2A2E35"}" stroke-width="3" fill="none"><title>Radar (presence)</title></path>`);
    const since = (ai.vacant_rooms || {})[rid], resting = (ai.resting || {})[rid];
    out.push(`<text x="${b.x + 16}" y="${b.y + 68}" class="room-sub num" style="fill:${since ? "var(--warn)" : "var(--person)"}">${since ? `empty ${mmss(now - since)} (radar + PIR)` : resting ? `resting ${mmss(now - resting)} (radar yes, no movement)` : ""}</text></g>`);
    (byRoom[rid] || []).forEach(([id, d], i) => {
      const cols = Math.max(1, Math.floor((b.w - 20) / 170)), cx = b.x + 34 + (i % cols) * 170, cy = b.y + b.h - 44 - Math.floor(i / cols) * 62;
      const pend = (ai.pending || {})[id], guard = (ai.guards || {})[id], off = (ai.smart_off || {})[id], paused = (ai.paused || {})[id];
      const press = d.write && d.button;
      out.push(`<g class="${press ? "clickable" : ""}"${press ? " " + cmd({action: "press", device: id}) : ""}><rect x="${cx - 26}" y="${cy - 26}" width="160" height="60" rx="10" fill="transparent"/>`);
      out.push(`<circle cx="${cx}" cy="${cy}" r="23" fill="none" stroke="${guard ? "var(--warn)" : "var(--accent)"}" stroke-width="${guard ? 2.5 : 2}" stroke-dasharray="${guard ? "none" : "4 4"}" opacity="${pend || guard ? 1 : 0}"/>`);
      out.push(iconSvg(d, cx, cy));
      out.push(`<text x="${cx + 26}" y="${cy - 3}" class="devlabel">${esc(d.label.replace(r.name + " ", ""))}</text>`);
      out.push(`<text x="${cx + 26}" y="${cy + 13}" class="devstate num">${esc(d.state)}${d.watts ? ` · ${d.watts} W` : ""}${d.fault ? " · ⚠ fault" : ""}</text>`);
      let tag = "", col = "var(--accent)";
      if (guard) { tag = `waiting for you ${mmss(guard.deadline - now)}`; col = "var(--warn)"; }
      else if (pend) tag = now < pend.start ? `AI at ${hm(pend.start)} · ${pct(pend.p)}` : `AI ready · ${pend.reason || "checking sensors"}`;
      else if (off && !off.paused) { tag = `AI off in ${mmss(off.off_at - now)}`; col = "var(--warn)"; }
      else if (paused) { tag = paused === "override" ? "AI hands off (manual)" : "AI paused"; col = "var(--muted)"; }
      out.push(`<text x="${cx + 26}" y="${cy + 29}" class="ai-tag num" style="fill:${col}">${esc(tag)}</text></g>`);
    });
  }
  out.push(`<rect x="415" y="566" width="60" height="8" rx="3" fill="#3A3F47"/><text x="485" y="600" class="room-sub">front door</text>`);
  morph("plan", $("planBody"), out.join(""), true);
  // the person: only his label is patched; his position belongs to the animation
  const p = S.person, sleeping = p.activity === "Sleeping";
  morph("avatar", $("avatarBody"), `<circle r="16" fill="var(--person)" opacity=".18"/><circle r="10" fill="var(--person)"/><circle cy="-15" r="6.5" fill="var(--person)"/><text x="14" y="-18" style="fill:var(--person);font-weight:700">${sleeping ? "z z" : ""}</text><g transform="translate(18,6)"><rect x="0" y="-13" rx="8" height="22" width="${Math.max(70, p.activity.length * 7.4 + 16)}" fill="#24202C" stroke="#4A3D5C"/><text x="8" y="2" style="fill:#E7D7F7;font-size:12.5px;font-weight:600">${esc(p.activity)}${p.still >= 0.8 && !sleeping ? " · still" : ""}</text></g>`, true);
  animatePerson(B);
}
function animatePerson(B) {
  const target = pointOf(S.person.room, B), key = S.person.room;
  if (!anim) { [avatar.x, avatar.y] = target; anim = {key, pts: [target], t0: 0, dur: 1, done: false}; placeAvatar(); return; }
  if (anim.key !== key) {
    const pts = waypoints(anim.key, key, B);
    pts[0] = [avatar.x, avatar.y];
    anim = {key, pts, t0: performance.now(), dur: Math.min(2400, 500 * pts.length), done: false};
  }
}
function placeAvatar() { $("avatar").setAttribute("transform", `translate(${avatar.x.toFixed(1)},${avatar.y.toFixed(1)})`); }
function frame() {
  if (anim && !anim.done) {                      // only touch the DOM while he is walking
    const k = Math.min(1, (performance.now() - anim.t0) / anim.dur), n = anim.pts.length - 1;
    if (n <= 0) { [avatar.x, avatar.y] = anim.pts[0]; }
    else { const f = k * n, i = Math.min(n - 1, Math.floor(f)), u = f - i, a = anim.pts[i], b = anim.pts[i + 1];
      avatar.x = a[0] + (b[0] - a[0]) * u; avatar.y = a[1] + (b[1] - a[1]) * u; }
    placeAvatar();
    if (k >= 1) anim.done = true;
  }
  tickClock();
  requestAnimationFrame(frame);
}

// ------------------------------------------------------------------ timeline
function drawTimeline() {
  const W = 1000, L = 130, R = 20, X = (h) => (L + (W - L - R) * h / 24).toFixed(1), out = [];
  const devs = Object.entries(S.devices).filter(([, d]) => d.write || d.icon === "tv");
  const H = 50 + 22 * (devs.length + 1), vb = `0 0 ${W} ${H}`;
  if ($("timeline").getAttribute("viewBox") !== vb) $("timeline").setAttribute("viewBox", vb);
  for (let h = 0; h <= 24; h += 3) out.push(`<line x1="${X(h)}" x2="${X(h)}" y1="18" y2="${H - 4}" stroke="#1F2227"/><text x="${X(h)}" y="12" text-anchor="middle" class="room-sub" style="font-size:11px">${pad(h)}:00</text>`);
  out.push(`<text x="0" y="40" class="devlabel">Person</text>`);
  for (const [a, b, room] of S.routine) out.push(`<rect x="${X(a)}" y="28" width="${Math.max(1, X(b) - X(a)).toFixed(1)}" height="16" fill="${ROOM_COLOR[room] || "#777"}" opacity=".22"/>`);
  const day0 = S.day0, nowH = (S.now - day0) / 3600;
  // one pass over the changes (not one per device)
  const roomCh = [], devCh = {};
  for (const c of S.changes) {
    if (c[1] === "room") roomCh.push([Math.max(0, (c[0] - day0) / 3600), c[3]]);
    else if (c[1] === "dev") (devCh[c[2]] ||= []).push([(c[0] - day0) / 3600, c[3]]);
  }
  roomCh.forEach(([h, room], i) => { const e = i + 1 < roomCh.length ? roomCh[i + 1][0] : nowH; if (e > 0) out.push(`<rect x="${X(h)}" y="31" width="${Math.max(1, X(e) - X(h)).toFixed(1)}" height="10" rx="2" fill="${ROOM_COLOR[room] || "#777"}"/>`); });
  const rowOf = {};
  devs.forEach(([id, d], k) => {
    rowOf[id] = k;
    const y = 56 + k * 22, ch = devCh[id] || [];
    out.push(`<text x="0" y="${y + 11}" class="devlabel" style="font-size:12px">${esc(d.label)}</text>`);
    let state = ch.length ? 1 - ch[0][1] : d.v, from = 0;
    const col = d.icon === "fan" ? "var(--fan)" : d.icon === "light" ? "var(--light)" : "var(--accent)";
    for (const [h, v] of ch) { if (state && h > from) out.push(`<rect x="${X(Math.max(0, from))}" y="${y}" width="${Math.max(1, X(h) - X(Math.max(0, from))).toFixed(1)}" height="12" rx="3" fill="${col}"/>`); state = v; from = h; }
    if (state) out.push(`<rect x="${X(Math.max(0, from))}" y="${y}" width="${Math.max(1, X(nowH) - X(Math.max(0, from))).toFixed(1)}" height="12" rx="3" fill="${col}"/>`);
  });
  for (const e of S.events) {
    if (e.group !== "ai" || !e.device || !(e.device in rowOf)) continue;
    const h = (e.at / 1000 - day0) / 3600; if (h < 0) continue;
    out.push(`<path d="M${X(h)} ${56 + rowOf[e.device] * 22 - 4} l4 4 l-4 4 l-4 -4z" fill="#fff"><title>${esc(e.title)} — ${esc(e.short || "")}</title></path>`);
  }
  out.push(`<line x1="${X(nowH)}" x2="${X(nowH)}" y1="20" y2="${H - 4}" stroke="var(--bad)" stroke-width="2"/>`);
  morph("timeline", $("timeline"), out.join(""), true);
}

// ------------------------------------------------------------------ side panel
const TABS = [["ai", "AI"], ["control", "Control"], ["scen", "Scenarios"], ["events", "Events"]];
function drawTabs() { morph("tabs", $("tabs"), TABS.map(([k, t]) => `<button class="${tab === k ? "on" : ""}" data-tab="${k}">${t}</button>`).join("")); }
const ACTION = {schedule_on: ["Will switch on", "var(--accent)"], keep_on: ["Keeps on", "var(--good)"], suggest_on: ["Asks: on?", "var(--warn)"],
  suggest_off: ["Asks: off?", "var(--warn)"], paused_by_override: ["Hands off", "var(--muted)"], paused_by_user: ["Paused", "var(--muted)"],
  learning: ["Learning", "var(--muted)"], none: ["Nothing", "var(--dim)"]};
function panelAI() {
  const ai = S.ai; if (!ai) return `<div class="card muted">The AI is not running. Install it with <code>pip install -r ai/requirements.txt</code>.</div>`;
  const label = (id) => (S.devices[id] || {}).label || id, now = S.now, o = [];
  if (S.ai_busy) o.push(`<div class="banner">Nightly retraining in the background · house time waits, the page stays live.</div>`);
  o.push(`<div class="card"><h3>Next hour — what the model thinks</h3>`);
  for (const d of ai.plan) {
    const [t, c] = ACTION[d.action] || [d.action, "var(--muted)"];
    o.push(`<div class="row"><div style="flex:1;min-width:0"><div><b>${esc(label(d.device))}</b> <span class="chip" style="color:${c}">${t}</span></div><div class="muted small">${esc(d.why || "")}</div></div><div class="bar"><span style="width:${pct(d.p_on)}"></span></div><span class="num small" style="width:36px;text-align:right">${pct(d.p_on)}</span></div>`);
  }
  if (!ai.plan.length) o.push(`<div class="muted small">Planning runs every 15 minutes (house time).</div>`);
  o.push(`</div>`);
  const pend = Object.entries(ai.pending), guards = Object.entries(ai.guards), sug = Object.entries(ai.suggestions);
  o.push(`<div class="card" style="margin-top:12px"><h3>Waiting for the sensors</h3>`);
  for (const [id, p] of pend) o.push(`<div class="row"><div style="flex:1"><b>${esc(label(id))}</b><div class="muted small">${now < p.start ? `from ${hm(p.start)}` : "now"} until ${hm(p.deadline)} · ${pct(p.p)} · ${esc(p.reason || "waiting")}</div></div></div>`);
  for (const [id, g] of guards) o.push(`<div class="row"><div style="flex:1"><b>${esc(label(id))}</b> <span class="chip" style="color:var(--warn)">waste guard</span><div class="muted small num">switched on at ${hm(g.on_at)} · off by itself in ${mmss(g.deadline - now)} if nobody comes</div></div></div>`);
  for (const [sid, s] of sug) o.push(`<div class="row"><div style="flex:1"><b>${esc(s.title)}</b> <span class="chip" style="color:var(--warn)">question</span><div class="muted small num">${pct(s.conf)} · withdrawn in ${mmss(s.expires - now)}${S.sim_answers ? " · the person answers in 1-4 min" : ""}</div></div><button class="btn" ${cmd({action: "answer", sid, yes: true})}>Yes</button><button class="btn" ${cmd({action: "answer", sid, yes: false})}>No</button></div>`);
  if (!pend.length && !guards.length && !sug.length) o.push(`<div class="muted small">Nothing waiting right now.</div>`);
  o.push(`</div>`);
  const LV = ["var(--muted)", "var(--accent)", "var(--good)"];
  o.push(`<div class="card" style="margin-top:12px"><h3>What it learned to do by itself</h3>${(ai.trust || []).map((t) => `<div class="row"><div style="flex:1"><b>${esc(t.label)}</b> <span class="chip" style="color:${LV[t.level]}">level ${t.level}</span><div class="muted small">${esc(t.text)} · ${t.level === 0 ? `${t.yes}/3 yes` : t.level === 1 ? `${t.ok}/5 without undo` : "trusted"}</div></div></div>`).join("") || `<div class="muted small">Nothing yet. It asks first; after 3 "yes" in a row it does it itself and tells you, after 5 more without an undo it stops telling you.</div>`}</div>`);
  const days = (S.kpi || []).slice(-7);
  if (days.length) o.push(`<div class="card" style="margin-top:12px"><h3>Per day — does it need you less?</h3><div style="overflow-x:auto"><table class="small num" style="width:100%;border-collapse:collapse"><tr class="muted"><td>Day</td><td title="you had to do it yourself">Fixes</td><td>Asked</td><td>Yes</td><td>Auto</td><td title="without asking, learned from your answers">Learned</td><td title="minutes a light burned while asleep">Asleep+light</td></tr>${days.map((k) => `<tr><td>${k.day.slice(5)}</td><td>${k.manual_fix}</td><td>${k.asked}</td><td>${k.yes}</td><td>${k.ai_auto}</td><td>${k.ai_learned}</td><td>${k.asleep_light_min}m</td></tr>`).join("")}</table></div><div class="hint">Fixes: the person had to do it himself (light on in the dark, light off when lying down). Full 4-week run: <code>python pi/learning_curve.py</code></div></div>`);
  const e = ai.energy || {}, st = ai.stats || {};
  o.push(`<div class="card" style="margin-top:12px"><h3>Energy and the AI today</h3><div class="metrics"><div><b class="num" style="color:var(--good)">${(e.saved_by_ai_wh ?? 0).toFixed(1)}</b><span>Wh saved (est.)</span></div><div><b class="num">${(e.wasted_by_ai_wh ?? 0).toFixed(1)}</b><span>Wh used by misses</span></div><div><b class="num">${(e.wasted_wh ?? 0).toFixed(1)}</b><span>Wh wasted in total</span></div></div><div class="muted small" style="margin-top:10px">Since start: switched on ${st.ai_on || 0} · came ${st.ai_hit || 0} · missed ${st.ai_miss || 0} · skipped by sensors ${st.skipped || 0} · smart off ${st.smart_off || 0} · asked ${st.suggested || 0} (yes ${st.accepted || 0}, expired ${st.expired || 0})</div></div>`);
  if ((ai.anomalies || []).length) o.push(`<div class="card" style="margin-top:12px"><h3>Power faults</h3>${ai.anomalies.slice().reverse().map((a) => `<div class="row"><div><b style="color:var(--warn)">${esc(a.title)}</b><div class="muted small">${esc(a.text)}</div></div></div>`).join("")}</div>`);
  return o.join("");
}
function panelControl() {
  const p = S.person, o = [];
  o.push(`<div class="card"><h3>The person</h3><div class="small">${p.manual ? "<b style='color:var(--warn)'>You are in control</b>" : "Following the routine"} · now: <b>${esc(p.activity)}</b> in <b>${esc((S.rooms[p.room] || {}).name || p.room)}</b></div><div class="grid2" style="margin-top:10px">${Object.entries(S.rooms).map(([rid, r]) => `<button class="btn${p.room === rid ? " pri" : ""}" ${cmd({action: "move", room: rid})}>${esc(r.name)}</button>`).join("")}<button class="btn" ${cmd({action: "move", room: "out"})}>Leave home</button><button class="btn pri" ${cmd({action: "routine"})}>Back to routine</button></div><div style="margin-top:10px" class="small">Movement: <span class="seg"><button class="${p.force_still == null ? "on" : ""}" ${cmd({action: "still", on: null})}>Routine</button><button class="${p.force_still === true ? "on" : ""}" ${cmd({action: "still", on: true})}>Sitting still</button><button class="${p.force_still === false ? "on" : ""}" ${cmd({action: "still", on: false})}>Moving</button></span></div><div class="hint">Sitting still: the PIR sees nothing but the radar still sees him — the AI must not switch anything off.</div></div>`);
  o.push(`<div class="card" style="margin-top:12px"><h3>Weather</h3><div class="small">Outside temperature <b class="num">${S.temp_delta >= 0 ? "+" : ""}${S.temp_delta}°C</b> vs normal</div><input type="range" min="-6" max="8" step="1" value="${S.temp_delta}" style="width:100%" data-change="temp"></div>`);
  const faults = [["", "Normal"], ["high", "Motor blocked (2× power)"], ["dead", "Burnt (no power)"], ["standby", "Stuck relay (power when off)"]];
  o.push(`<div class="card" style="margin-top:12px"><h3>Faults</h3>${Object.entries(S.devices).filter(([, d]) => d.watts != null && d.icon !== "lock").map(([id, d]) => `<div class="row"><span style="flex:1">${esc(d.label)}</span><select data-change="fault" data-device="${esc(id)}">${faults.map(([v, t]) => `<option value="${v}"${(d.fault || "") === v ? " selected" : ""}>${t}</option>`).join("")}</select></div>`).join("")}<div class="row"><span style="flex:1">Wrong PIN at the door</span><button class="btn" ${cmd({action: "wrong_pin"})}>Try</button></div>${[...new Set(Object.values(S.rooms).map((r) => r.node))].filter(Boolean).map((n) => {
      const off = Object.values(S.rooms).some((r) => r.node === n && r.offline);
      return `<div class="row"><span style="flex:1">${esc(n)} node</span><button class="btn" ${cmd({action: "node", node: n, offline: !off})}>${off ? "Bring online" : "Take offline"}</button></div>`; }).join("")}</div>`);
  return o.join("");
}
function panelScen() {
  const sc = S.scenarios; if (!sc) return `<div class="card muted">Scenarios are not available.</div>`;
  const o = [];
  if (sc.running) o.push(`<div class="card" style="border-color:#3B4A66"><h3>Running</h3><b>${esc(sc.running.title)}</b><div class="muted small num">${esc(sc.running.step)} · ${sc.running.elapsed_min} min (house time)</div><button class="btn" style="margin-top:8px" ${cmd({action: "scenario_stop"})}>Stop</button></div>`);
  o.push(`<div class="card" style="margin-top:12px"><h3>Test the AI</h3>${sc.catalog.map((c) => `<div class="row"><div style="flex:1"><b>${esc(c.title)}</b><div class="muted small">${esc(c.desc)}</div></div><button class="btn"${sc.running ? " disabled" : ""} ${cmd({action: "scenario", id: c.id})}>Run</button></div>`).join("")}</div>`);
  if (sc.results.length) o.push(`<div class="card" style="margin-top:12px"><h3>Results</h3>${sc.results.slice().reverse().map((r) => `<div class="row"><div style="flex:1"><b>${esc(r.title)}</b> <span class="chip ${r.ok ? "pass" : "fail"}">${r.ok ? "PASS" : "FAIL"}</span><div class="muted small">${esc(r.detail)}</div></div><span class="muted small num">${r.at}</span></div>`).join("")}<div class="hint">Also saved in pi/twin/reports/ for the report.</div></div>`);
  return o.join("");
}
const EV_COL = {ai: "var(--accent)", rule: "var(--fan)", manual: "var(--text)", door: "var(--person)", system: "var(--muted)", alert: "var(--warn)"};
function panelEvents() {
  return `<div class="card"><h3>Live events</h3>${S.events.map((e) => `<div class="row"><span class="num muted small" style="width:42px;flex:none">${hm(e.at / 1000)}</span><div style="flex:1;min-width:0"><div class="ev-title" style="color:${EV_COL[e.group] || "var(--text)"}">${esc(e.title)}</div><div class="muted small">${esc(e.src)}${e.short ? " · " + esc(e.short) : ""}</div></div></div>`).join("") || `<div class="muted small">Nothing yet.</div>`}</div>`;
}
const PANELS = {ai: panelAI, control: panelControl, scen: panelScen, events: panelEvents};
function render() {
  if (!S) return;
  header(); drawPlan(); drawTimeline(); drawTabs();
  morph("panel", $("panel"), PANELS[tab]());
}
pollLoop(); requestAnimationFrame(frame);
</script>
</body>
