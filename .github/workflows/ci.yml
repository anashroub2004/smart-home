name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    name: Web — type-check & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run typecheck
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: web-out
          path: web/out

  python:
    name: Python — syntax & simulator imports
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m py_compile pi/*.py pi/deploy/*.py pi/tests/*.py ai/*.py ai/tests/*.py
      - run: bash -n pi/deploy/install.sh
      - run: python -c "import sys; sys.path.insert(0,'pi'); import sim_house, firebase_writer, rest_db"
      - run: pip install -r pi/requirements.txt
      - name: AI unit tests (policy, gate, energy, features, anomaly, runtime, training)
        run: python -m unittest discover -s ai/tests -t . -v
      - name: Pi unit tests (door guard, security, outbox / local first, ingest offline, commands stream)
        run: python -m unittest discover -s pi/tests -v
      - run: python -c "import json; json.load(open('docs/seed.json')); json.load(open('database.rules.json'))"
